[program:tamperforge-phi4-rank-matrix]
directory=/workspace/tamperforge
command=/bin/bash scripts/runs/run_phi4mini_rank12_then_resume.sh
autostart=false
autorestart=unexpected
startsecs=5
startretries=1
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=45
stdout_logfile=/workspace/tamperforge/logs/eval/phi4mini_vg/rank_matrix_supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=0
