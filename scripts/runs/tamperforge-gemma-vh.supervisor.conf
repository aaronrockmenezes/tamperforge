[program:tamperforge-gemma-vh]
command=/workspace/tamperforge/scripts/runs/run_version_h_gemma.sh
directory=/workspace/tamperforge
autostart=false
autorestart=false
startsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/tamperforge/logs/drivers/gemma_vh_supervisor.log
stderr_logfile=/workspace/tamperforge/logs/drivers/gemma_vh_supervisor.err.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
