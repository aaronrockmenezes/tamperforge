[program:tamperforge-vgho-judge]
environment=VGHO_JUDGE_YIELD_TO_MAIN="0",VGHO_JUDGE_WORKERS="32"
command=/workspace/tamperforge/scripts/runs/supervisor_version_g_extended_judge.sh
directory=/workspace/tamperforge
autostart=false
autorestart=unexpected
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/tamperforge/logs/eval/vgho_judge_supervisor.log
redirect_stderr=true
stdout_logfile_maxbytes=0
