[program:tamperforge-backup-export]
command=/venv/main/bin/python -m http.server 18081 --bind 127.0.0.1 --directory /workspace/tamperforge/teardown_export
directory=/workspace/tamperforge
autostart=false
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/tamperforge/logs/ops/backup_export.log
stderr_logfile=/workspace/tamperforge/logs/ops/backup_export.err.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
