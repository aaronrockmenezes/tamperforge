# Base model config for tamperforge experiments.
model:
  id: google/gemma-3-1b-it
  dtype: bfloat16
  n_layers: 26
  d_model: 1152

sae:
  # Optional later-analysis path. P1 does not depend on SAE directions.
  release: gemma-scope-2-1b-it-res
  sae_id: layer_13_width_16k_l0_medium
  layer: 13

abliterate:
  # which layers the attacker projects attack directions out of
  # Default policy: all layers. L13-only is retained only as a one-off legacy
  # comparison against the old mindweather result.
  layers: all

eval:
  n_advbench: 100
  n_arc: 100
  seed: 42

data:
  advbench_source: walledai
  advbench_hf_id: walledai/AdvBench
  advbench_split: train
  # Legacy/internal only.
  advbench_csv: data/advbench_harmful_behaviors.csv
  features_safety: data/features_safety.json
